name: Build POCO C40 Clean Mega-Kernel (No Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev dwarves python3 python-is-python3 zip unzip wget

      - name: Clone Fakezay Kernel & Toolchains
        run: |
          GH=$(printf '%s://%s.%s' 'https' 'github' 'com')
          AOSP=$(printf '%s://%s.%s.%s' 'https' 'android' 'googlesource' 'com')
          git clone --depth=1 "$GH/Fakezay/c40.git" kernel
          mkdir -p clang gcc64 gcc32
          curl -sL "$AOSP/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar -xz -C clang
          git clone --depth=1 -b lineage-18.1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" gcc64
          git clone --depth=1 -b lineage-18.1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" gcc32

      - name: Configure Kernel (Fakezay Base + NO Docker)
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 frost_kernelsu_docker_defconfig

          # Вырезаем ВСЁ, что связано с Docker и ломает сеть в LineageOS 18.1, оставляя KSU, TWRP, WireGuard и BBR!
          ./scripts/config --file out/.config \
            -d CONFIG_NAMESPACES \
            -d CONFIG_UTS_NS \
            -d CONFIG_IPC_NS \
            -d CONFIG_PID_NS \
            -d CONFIG_NET_NS \
            -d CONFIG_USER_NS \
            -d CONFIG_VETH \
            -d CONFIG_BRIDGE \
            -d CONFIG_BRIDGE_NETFILTER \
            -d CONFIG_MACVLAN \
            -d CONFIG_CGROUP_DEVICE \
            -d CONFIG_CGROUP_PIDS \
            -d CONFIG_POSIX_MQUEUE \
            -d CONFIG_IP_SET \
            -d CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            -e CONFIG_KSU \
            -e CONFIG_NET_UDP_TUNNEL \
            -e CONFIG_DST_CACHE \
            -e CONFIG_WIREGUARD \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr"

          make O=out ARCH=arm64 olddefconfig

      - name: Compile Kernel & DTB
        working-directory: kernel
        run: |
          export PATH="$PWD/../clang/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs

      - name: Verify KABI offsets
        working-directory: kernel
        run: |
          pahole -C net_device out/vmlinux | grep -E "rx_handler.*792|pcpu_refcnt.*1144"
          pahole -C net out/vmlinux | grep -E "gen.*3168"

      - name: Upload Clean Kernel & DTB
        uses: actions/upload-artifact@v4
        with:
          name: clean-fakezay-kernel
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dts/jlq/*.dtb
