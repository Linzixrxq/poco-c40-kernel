name: Build POCO C40 Mega-Kernel (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev lz4 python3 python-is-python3 unzip wget zip

      - name: Download Toolchains (clang-r383902 & GCC 4.9)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          GH=$(printf '%s://%s.%s' 'https' 'github' 'com')
          AOSP=$(printf '%s://%s.%s.%s' 'https' 'android' 'googlesource' 'com')

          mkdir -p clang-r383902
          curl -sL "$AOSP/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar -xz -C clang-r383902

          git clone --depth=1 -b lineage-18.1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" gcc64
          git clone --depth=1 -b lineage-18.1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" gcc32

      - name: Apply KernelSU v0.9.5 & Overclock tables from Fakezay
        run: |
          GH=$(printf '%s://%s.%s' 'https' 'github' 'com')
          git clone --depth=1 --recursive -b frost-kernelsu-docker-pure-stock-abi "$GH/Fakezay/c40.git" /tmp/fakezay
          git -C /tmp/fakezay submodule update --init --recursive

          # 1. Скачиваем реальные исходники KernelSU v0.9.5 и ставим хуки Fakezay
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 -b v0.9.5 "$GH/tiann/KernelSU.git" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          cp -f /tmp/fakezay/drivers/Kconfig drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile
          sed -i '1i CONFIG_KSU := y\nobj-y += kernelsu.o\nccflags-y += -DKSU_MANUAL_HOOK -DCONFIG_KSU=1' KernelSU/kernel/Makefile
          sed -i 's/#ifdef CONFIG_KSU_WITH_KPROBES/#if 0/g' KernelSU/kernel/*.c KernelSU/kernel/*.h
          sed -i 's/#ifndef CONFIG_KSU_WITH_KPROBES/#if 1/g' KernelSU/kernel/*.c KernelSU/kernel/*.h
          cp -f /tmp/fakezay/fs/exec.c fs/exec.c
          cp -f /tmp/fakezay/fs/open.c fs/open.c
          cp -f /tmp/fakezay/fs/read_write.c fs/read_write.c
          cp -f /tmp/fakezay/fs/stat.c fs/stat.c
          cp -f /tmp/fakezay/drivers/input/input.c drivers/input/input.c
          cp -f /tmp/fakezay/drivers/tty/pty.c drivers/tty/pty.c
          cp -f /tmp/fakezay/security/selinux/hooks.c security/selinux/hooks.c

          # 2. Переносим таблицы частот и напряжений (Overclock CPU 2.2GHz / OPP / DDR / Thermal)
          cp -f /tmp/fakezay/arch/arm64/boot/dts/jlq/jlq_jr510.dts arch/arm64/boot/dts/jlq/jlq_jr510.dts
          cp -f /tmp/fakezay/arch/arm64/boot/dts/jlq/jr510-opp.dtsi arch/arm64/boot/dts/jlq/jr510-opp.dtsi

      - name: Create ld.lld wrapper (ABI preservation)
        run: |
          mkdir -p $HOME/wrapper
          cat << 'EOF' > $HOME/wrapper/ld.lld-wrapper
          #!/bin/bash
          exec $HOME/toolchains/clang-r383902/bin/ld.lld --no-threads --thinlto-jobs=1 "$@"
          EOF
          chmod +x $HOME/wrapper/ld.lld-wrapper

      - name: Compile Mega-Kernel (Image.gz & dtbo.img)
        run: |
          export PATH="$HOME/toolchains/clang-r383902/bin:$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH"
          mkdir -p out
          cp configs/lineage-frost-kernel1.config out/.config

          # Включаем KernelSU (без kprobes), WireGuard и TCP BBR поверх сети LineageOS
          sed -i '/depends on/d' KernelSU/kernel/Kconfig
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_OVERLAY_FS \
            -d CONFIG_KSU_WITH_KPROBES \
            -e CONFIG_WIREGUARD \
            -e CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=$HOME/wrapper/ld.lld-wrapper \
            olddefconfig

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=$HOME/wrapper/ld.lld-wrapper \
            -j$(nproc) Image.gz dtbs

      - name: Upload compiled Mega-Kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poco-c40-megakernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/jlq/*.dtb
            out/arch/arm64/boot/dts/jlq/*.dtbo
